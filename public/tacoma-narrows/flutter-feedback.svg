<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono','Courier New',monospace">

  <rect width="640" height="430" fill="#f5f0e8"/>

  <text x="320" y="26" text-anchor="middle" font-size="9" letter-spacing="0.2em" fill="#8a8480">AEROELASTIC FLUTTER — NEGATIVE DAMPING</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#1a1814"/>
    </marker>
  </defs>

  <!-- ════════════════════════════════════════
       NODES
       Node 1 (top):    x=210–430  y=55–111   centre (320, 83)
       Node 2 (right):  x=432–618  y=186–242  centre (525, 214)
       Node 3 (bottom): x=170–470  y=300–362  centre (320, 331)
       Node 4 (left):   x=22–208   y=186–242  centre (115, 214)
  ════════════════════════════════════════ -->

  <!-- Node 1 -->
  <rect x="210" y="55" width="220" height="56" rx="4" fill="#ede8dc" stroke="rgba(26,24,20,0.3)" stroke-width="1.5"/>
  <text x="320" y="79" text-anchor="middle" font-size="11" fill="#1a1814" letter-spacing="0.03em">Deck begins to twist</text>
  <text x="320" y="95" text-anchor="middle" font-size="9" fill="#4a4640" letter-spacing="0.06em">(slipped cable triggers asymmetry)</text>

  <!-- Node 2 -->
  <rect x="432" y="186" width="186" height="56" rx="4" fill="#ede8dc" stroke="rgba(26,24,20,0.3)" stroke-width="1.5"/>
  <text x="525" y="210" text-anchor="middle" font-size="11" fill="#1a1814" letter-spacing="0.03em">Girder angle</text>
  <text x="525" y="226" text-anchor="middle" font-size="11" fill="#1a1814" letter-spacing="0.03em">to wind changes</text>

  <!-- Node 3 — key mechanism -->
  <rect x="170" y="300" width="300" height="62" rx="4" fill="rgba(139,26,26,0.07)" stroke="#8b1a1a" stroke-width="2"/>
  <text x="320" y="324" text-anchor="middle" font-size="11" fill="#8b1a1a" font-weight="600" letter-spacing="0.03em">Aerodynamic lift acts IN THE SAME</text>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#8b1a1a" font-weight="600" letter-spacing="0.03em">DIRECTION as the twist</text>
  <text x="320" y="354" text-anchor="middle" font-size="8" fill="#8b1a1a" letter-spacing="0.12em">KEY MECHANISM</text>

  <!-- Node 4 -->
  <rect x="22" y="186" width="186" height="56" rx="4" fill="#ede8dc" stroke="rgba(26,24,20,0.3)" stroke-width="1.5"/>
  <text x="115" y="210" text-anchor="middle" font-size="11" fill="#1a1814" letter-spacing="0.03em">Twist amplifies</text>
  <text x="115" y="226" text-anchor="middle" font-size="9" fill="#4a4640" letter-spacing="0.06em">each cycle larger than last</text>

  <!-- ════════════════════════════════════════
       ARROWS — L-shaped orthogonal connectors, one 90° turn each.
       All start/end on node edges. Clockwise: 1→2→3→4→1.

       1→2  right edge of node1 (430,83) → right → down → top of node2 (525,186)
       2→3  bottom of node2 (525,242)   → down  → left → right edge of node3 (470,314)
       3→4  left edge of node3 (170,331) → left  → up   → bottom of node4 (76,242)
       4→1  top of node4 (76,186)        → up    → right → left edge of node1 (210,83)
  ════════════════════════════════════════ -->

  <!-- 1 → 2 -->
  <polyline points="430,83 525,83 525,186"
    fill="none" stroke="#1a1814" stroke-width="2"
    stroke-linejoin="round" marker-end="url(#arr)"/>

  <!-- 2 → 3 -->
  <polyline points="525,242 525,314 470,314"
    fill="none" stroke="#1a1814" stroke-width="2"
    stroke-linejoin="round" marker-end="url(#arr)"/>

  <!-- 3 → 4 -->
  <polyline points="170,331 76,331 76,242"
    fill="none" stroke="#1a1814" stroke-width="2"
    stroke-linejoin="round" marker-end="url(#arr)"/>

  <!-- 4 → 1 -->
  <polyline points="76,186 76,83 210,83"
    fill="none" stroke="#1a1814" stroke-width="2"
    stroke-linejoin="round" marker-end="url(#arr)"/>

  <!-- Centre label -->
  <text x="320" y="204" text-anchor="middle" font-size="9" fill="#8a8480" letter-spacing="0.14em">WIND SUPPLIES</text>
  <text x="320" y="218" text-anchor="middle" font-size="9" fill="#8a8480" letter-spacing="0.14em">THE ENERGY</text>

  <!-- Caption -->
  <line x1="40" y1="384" x2="600" y2="384" stroke="rgba(26,24,20,0.1)" stroke-width="1"/>
  <text x="320" y="399" text-anchor="middle" font-size="10" fill="#4a4640">In resonance, an external force drives the motion at a matching frequency.</text>
  <text x="320" y="415" text-anchor="middle" font-size="10" fill="#4a4640">In flutter, the structure's own movement generates the amplifying force. No frequency match required.</text>

</svg>
