<svg viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono','Courier New',monospace">

  <rect width="580" height="220" fill="#f5f0e8"/>

  <!-- Wind arrows approaching from left -->
  <line x1="16" y1="80"  x2="86" y2="80"  stroke="#b8860b" stroke-width="1.8"/>
  <polygon points="86,76 94,80 86,84" fill="#b8860b"/>
  <line x1="16" y1="110" x2="86" y2="110" stroke="#b8860b" stroke-width="1.8"/>
  <polygon points="86,106 94,110 86,114" fill="#b8860b"/>
  <line x1="16" y1="140" x2="86" y2="140" stroke="#b8860b" stroke-width="1.8"/>
  <polygon points="86,136 94,140 86,144" fill="#b8860b"/>

  <!-- Blunt cross-section (rectangular girder) -->
  <rect x="96" y="88" width="60" height="44" fill="#ede8dc" stroke="#1a1814" stroke-width="2.5"/>
  <text x="126" y="114" font-size="8" fill="#4a4640" text-anchor="middle">cross-</text>
  <text x="126" y="124" font-size="8" fill="#4a4640" text-anchor="middle">section</text>

  <!-- Flow separation — upper and lower paths -->
  <!-- Upper stream: curves up and over -->
  <path d="M 96,92 C 84,80 74,74 64,80" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M 156,92 C 168,80 200,72 240,76" fill="none" stroke="#b8860b" stroke-width="1.8"/>
  <polygon points="236,72 244,76 238,82" fill="#b8860b"/>

  <!-- Lower stream: curves down and under -->
  <path d="M 96,128 C 84,140 74,146 64,140" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M 156,128 C 168,140 200,148 240,144" fill="none" stroke="#b8860b" stroke-width="1.8"/>
  <polygon points="236,140 244,144 238,150" fill="#b8860b"/>

  <!-- Vortex 1 — upper, closer (recently shed) -->
  <path d="M 260,72 C 268,60 288,60 296,72 C 304,84 288,92 276,84 C 268,78 272,68 280,68" fill="none" stroke="#1a1814" stroke-width="1.8"/>
  <polygon points="278,64 282,72 274,70" fill="#1a1814"/>
  <text x="278" y="56" font-size="8" fill="#1a1814" text-anchor="middle" letter-spacing="0.06em">vortex shed</text>
  <text x="278" y="46" font-size="8" fill="#1a1814" text-anchor="middle" letter-spacing="0.06em">from top</text>

  <!-- Vortex 2 — lower, further (previously shed) -->
  <path d="M 340,148 C 348,160 368,160 376,148 C 384,136 368,128 356,136 C 348,142 352,152 360,152" fill="none" stroke="#1a1814" stroke-width="1.8"/>
  <polygon points="358,156 362,148 370,152" fill="#1a1814"/>
  <text x="358" y="170" font-size="8" fill="#1a1814" text-anchor="middle" letter-spacing="0.06em">vortex shed</text>
  <text x="358" y="180" font-size="8" fill="#1a1814" text-anchor="middle" letter-spacing="0.06em">from bottom</text>

  <!-- Alternating arrows showing force direction -->
  <!-- Upward force arrow on structure when lower vortex active -->
  <line x1="126" y1="86" x2="126" y2="66" stroke="#8b1a1a" stroke-width="2"/>
  <polygon points="121,66 126,56 131,66" fill="#8b1a1a"/>
  <text x="138" y="62" font-size="8" fill="#8b1a1a" letter-spacing="0.06em">force ↑</text>

  <!-- Caption -->
  <line x1="30" y1="200" x2="550" y2="200" stroke="rgba(26,24,20,0.1)" stroke-width="1"/>
  <text x="290" y="213" font-size="9" fill="#4a4640" text-anchor="middle" letter-spacing="0.04em">Vortices shed alternately from each side, creating an oscillating force on the structure.</text>

</svg>
